<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MotivAppte — Una frase. Un impulso.</title>
  <desc id="desc">Imagen de presentación de MotivAppte con su logotipo de montaña y amanecer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19122E"/>
      <stop offset=".48" stop-color="#3F2397"/>
      <stop offset="1" stop-color="#6A43DD"/>
    </linearGradient>
    <linearGradient id="sun" x1="780" y1="160" x2="780" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE66D"/>
      <stop offset="1" stop-color="#FF9B58"/>
    </linearGradient>
    <linearGradient id="mountains" x1="600" y1="260" x2="1050" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B35C2"/>
      <stop offset="1" stop-color="#24135E"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="96" y="84" width="82" height="82" rx="23"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient lights -->
  <circle cx="970" cy="70" r="250" fill="#A98DFF" opacity=".16"/>
  <circle cx="250" cy="590" r="280" fill="#8A6BFF" opacity=".12"/>
  <circle cx="790" cy="260" r="150" fill="#FFD85D" opacity=".10" filter="url(#blur)"/>

  <!-- Right-side sunrise landscape -->
  <g opacity=".98">
    <circle cx="820" cy="280" r="91" fill="url(#sun)"/>

    <g stroke="#FFC65B" stroke-width="8" stroke-linecap="round" opacity=".85">
      <path d="M820 126V88"/>
      <path d="M750 145L728 111"/>
      <path d="M890 145L912 111"/>
      <path d="M700 188L666 168"/>
      <path d="M940 188L974 168"/>
      <path d="M681 247L641 240"/>
      <path d="M959 247L999 240"/>
    </g>

    <path d="M520 510 L625 382 L690 425 L785 300 L855 390 L953 272 L1060 406 L1230 310 L1230 650 L520 650Z"
          fill="#4B2BAE"/>
    <path d="M500 550 L625 433 L690 475 L785 350 L855 435 L953 322 L1060 448 L1230 370 L1230 650 L500 650Z"
          fill="#351E84"/>

    <!-- M-shaped main mountain -->
    <path d="M690 515 L782 307 L820 355 L858 307 L950 515
             L884 477 L850 401 L820 448 L790 401 L756 477 Z"
          fill="#F8F3FF"/>
    <path d="M690 515 L756 477 L733 535 Z" fill="#D7CAFF"/>
    <path d="M950 515 L884 477 L907 535 Z" fill="#D7CAFF"/>

    <path d="M470 570 L600 488 L675 530 L755 478 L825 535 L925 475 L1005 526 L1230 410 L1230 650 L470 650Z"
          fill="url(#mountains)" opacity=".92"/>
  </g>

  <!-- Brand -->
  <rect x="96" y="84" width="82" height="82" rx="23" fill="#6E48DF"/>

  <!-- Mini version of official M/sun logo -->
  <g transform="translate(96 84) scale(.16015625)">
    <rect width="512" height="512" rx="112" fill="#6338D1"/>
    <circle cx="256" cy="225" r="63" fill="url(#sun)"/>
    <g stroke="#FFC65B" stroke-width="9" stroke-linecap="round">
      <path d="M256 103V62"/><path d="M204 116L181 82"/><path d="M308 116L331 82"/>
      <path d="M169 154L134 132"/><path d="M343 154L378 132"/>
    </g>
    <path d="M-30 343 L85 251 L142 300 L213 238 L280 310 L351 242 L438 319 L540 255 L540 540 L-30 540Z" fill="#3B238F"/>
    <path d="M92 386 L174 202 L256 303 L338 202 L420 386 L344 346 L303 267 L256 341 L209 267 L168 346Z" fill="#FFFFFF"/>
  </g>

  <text x="202" y="139"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="800"
        letter-spacing="-1.5"
        fill="#FFFFFF">MotivAppte</text>

  <text x="96" y="280"
        font-family="Arial, Helvetica, sans-serif"
        font-size="74"
        font-weight="800"
        letter-spacing="-2.5"
        fill="#FFFFFF">Una frase.</text>

  <text x="96" y="365"
        font-family="Arial, Helvetica, sans-serif"
        font-size="74"
        font-weight="800"
        letter-spacing="-2.5"
        fill="#FFD86B">Un impulso.</text>

  <text x="100" y="425"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="400"
        fill="#E6E0F4">Inspiración diaria, favoritos y recordatorios</text>

  <text x="100" y="462"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="400"
        fill="#E6E0F4">para tu mejor versión.</text>

  <text x="100" y="535"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="2"
        fill="#BDB0E9">APPTENEA · MOTIVACIÓN · CADA DÍA</text>
</svg>
